{% extends 'base.html' %}
{% block title %}Nueva contraseña{% endblock %}

{% block content %}
<div class="password-card">

    <h2>Crear nueva contraseña</h2>
    <p>Ingresa tu nueva contraseña para continuar.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.new_password1 }}
        {{ form.new_password2 }}

        <button type="submit" class="btn-password">Guardar nueva contraseña</button>
    </form>

</div>
{% endblock %}
