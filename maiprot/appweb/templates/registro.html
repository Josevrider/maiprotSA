{% extends 'base.html' %}
{% load static %}

{% block title %}Registro{% endblock %}

{% block content %}
<section class="form-section">
    <div class="form-container">
        
        <h2>Crear cuenta</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- RUT -->
            <div class="form-group">
                <label for="rut">RUT</label>
                <input type="text" id="rut" name="rut" placeholder="11.111.111-1" required>
            </div>

            <!-- Nombres -->
            <div class="form-group">
                <label for="first_name">Nombre</label>
                <input type="text" id="first_name" name="first_name" placeholder="Ej: Juan" required>
            </div>

            <!-- Apellidos -->
            <div class="form-group">
                <label for="last_name">Apellido</label>
                <input type="text" id="last_name" name="last_name" placeholder="Ej: Pérez" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <!-- Contraseña -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="********" required>
            </div>

            <!-- Confirmación contraseña -->
            <div class="form-group">
                <label for="password2">Confirmar contraseña</label>
                <input type="password" id="password2" name="password2" placeholder="********" required>
            </div>

            <button type="submit" class="btn">Registrarse</button>
        </form>

        <p class="form-footer">
            ¿Ya tienes una cuenta?  
            <a href="{% url 'login' %}">Inicia sesión aquí</a>
        </p>

    </div>
</section>
{% endblock %}
