{% extends "base.html" %}
{% block content %}

<h2>Usuarios del sistema</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Staff</th>
    </tr>

    {% for u in usuarios %}
    <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.first_name }} {{ u.last_name }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.is_staff }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
